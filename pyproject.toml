[project]
name = "pychunkie"
version = "0.1.0"
description = "A Python port of the MATLAB chunkIE package."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fmm2dpy @ git+https://github.com/flatironinstitute/fmm2d.git@550dae5b77b1e006c8ffae37fc832f8c2b536871",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
